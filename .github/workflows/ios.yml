name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project HomeLink.xcodeproj \
            -scheme HomeLink \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            build | xcbeautify
          cd build/simulator/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/HomeLink-simulator.zip" HomeLink.app

      - name: Build an unsigned iPhone package
        run: |
          set -o pipefail
          xcodebuild \
            -project HomeLink.xcodeproj \
            -scheme HomeLink \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            build | xcbeautify
          mkdir -p Payload
          cp -R build/device/Build/Products/Debug-iphoneos/HomeLink.app Payload/
          zip -r "$GITHUB_WORKSPACE/HomeLink-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HomeLink-builds
          path: |
            HomeLink-simulator.zip
            HomeLink-unsigned.ipa
          if-no-files-found: error
