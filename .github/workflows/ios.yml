name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for the iOS Simulator
        run: |
          set +e
          xcodebuild \
            -project HomeLink.xcodeproj \
            -scheme HomeLink \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            SWIFT_INSTALL_OBJC_HEADER=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            SWIFT_EXPERIMENTAL_FEATURE_DEBUG_DESCRIPTION_MACRO=NO \
            SWIFT_EMIT_LOC_STRINGS=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build > "$RUNNER_TEMP/simulator.log" 2>&1
          status=$?
          cp "$RUNNER_TEMP/simulator.log" "$GITHUB_WORKSPACE/simulator.log" || true
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/simulator.log" "$RUNNER_TEMP/errors.txt" <<'PY'
import sys
text = open(sys.argv[1], errors="replace").read().splitlines()
kept = []
for line in text:
    low = line.lower()
    if "error:" in low or "fatal error" in low or ".swift:" in line:
        if "swiftcompile normal" in low and "error:" not in low:
            continue
        kept.append(line[:500])
if not kept:
    kept = [line[:500] for line in text if "failed" in line.lower()][-20:]
open(sys.argv[2], "w", encoding="utf-8").write("\n".join(kept[:60]))
PY
            echo "===== compiler errors ====="
            cat "$RUNNER_TEMP/errors.txt"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < "$RUNNER_TEMP/errors.txt"
            {
              echo "## 模拟器编译失败"
              echo '```'
              cat "$RUNNER_TEMP/errors.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          cd build/simulator/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/HomeLink-simulator.zip" HomeLink.app

      - name: Build an unsigned iPhone package
        run: |
          set +e
          xcodebuild \
            -project HomeLink.xcodeproj \
            -scheme HomeLink \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            SWIFT_INSTALL_OBJC_HEADER=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            SWIFT_EXPERIMENTAL_FEATURE_DEBUG_DESCRIPTION_MACRO=NO \
            SWIFT_EMIT_LOC_STRINGS=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build > "$RUNNER_TEMP/device.log" 2>&1
          status=$?
          cp "$RUNNER_TEMP/device.log" "$GITHUB_WORKSPACE/device.log" || true
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/device.log" "$RUNNER_TEMP/errors.txt" <<'PY'
import sys
text = open(sys.argv[1], errors="replace").read().splitlines()
kept = []
for line in text:
    low = line.lower()
    if "error:" in low or "fatal error" in low or ".swift:" in line:
        if "swiftcompile normal" in low and "error:" not in low:
            continue
        kept.append(line[:500])
if not kept:
    kept = [line[:500] for line in text if "failed" in line.lower()][-20:]
open(sys.argv[2], "w", encoding="utf-8").write("\n".join(kept[:60]))
PY
            echo "===== compiler errors ====="
            cat "$RUNNER_TEMP/errors.txt"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < "$RUNNER_TEMP/errors.txt"
            {
              echo "## 真机打包失败"
              echo '```'
              cat "$RUNNER_TEMP/errors.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          mkdir -p Payload
          cp -R build/device/Build/Products/Debug-iphoneos/HomeLink.app Payload/
          zip -r "$GITHUB_WORKSPACE/HomeLink-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            simulator.log
            device.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: HomeLink-builds
          path: |
            HomeLink-simulator.zip
            HomeLink-unsigned.ipa
          if-no-files-found: error
